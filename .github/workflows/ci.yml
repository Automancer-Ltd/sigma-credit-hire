name: CI
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  # Bound scripts/check npm install fetch stall to ~2m total (t6474 / t6586).
  npm_config_fetch_timeout: "20000"
  npm_config_fetch_retries: "4"
  npm_config_fetch_retry_mintimeout: "2000"
  npm_config_fetch_retry_maxtimeout: "10000"
jobs:
  check:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
    # Secret scan of every commit, in the job that always runs. The binary is pinned, with retries.
    - name: Scan for secrets
      timeout-minutes: 3
      env:
        GITLEAKS_VERSION: 8.30.1
      run: |
        curl -fsSL --max-time 60 --retry 4 --retry-delay 2 --retry-all-errors \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          | tar -xz -C "$RUNNER_TEMP" gitleaks
        "$RUNNER_TEMP/gitleaks" git --redact --config .gitleaks.toml --no-banner
    - run: scripts/check
