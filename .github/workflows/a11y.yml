name: Accessibility
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  axe:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    env:
      # The contact labels fail contrast today; turn it on when that fix lands
      # (the design pass in PR #5, or the contrast-only draft beside it).
      A11Y_DISABLE_RULES: color-contrast
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
    - name: Install the checker
      run: |
        cp .github/a11y/check.mjs "$RUNNER_TEMP/"
        cd "$RUNNER_TEMP"
        npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.64.1 @axe-core/playwright@4.14.0
        npx playwright install --with-deps chromium
    - name: Check the page with axe
      run: node "$RUNNER_TEMP/check.mjs" .
